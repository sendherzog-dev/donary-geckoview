name: Build standalone Donary APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create clean GeckoView Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/yiddishcoaching/donary

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://maven.mozilla.org/maven2/") }
              }
          }

          rootProject.name = "DonaryStandalone"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.11.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.yiddishcoaching.donary"
              compileSdk 36

              defaultConfig {
                  applicationId "com.yiddishcoaching.donary"
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
                  resources {
                      excludes += [
                          "META-INF/DEPENDENCIES",
                          "META-INF/LICENSE",
                          "META-INF/LICENSE.txt",
                          "META-INF/NOTICE",
                          "META-INF/NOTICE.txt"
                      ]
                  }
              }
          }

          dependencies {
              implementation "org.mozilla.geckoview:geckoview:+"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:label="Donary"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/yiddishcoaching/donary/MainActivity.java <<'EOF'
          package com.yiddishcoaching.donary;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          import org.mozilla.geckoview.GeckoRuntime;
          import org.mozilla.geckoview.GeckoSession;
          import org.mozilla.geckoview.GeckoView;

          public final class MainActivity extends Activity {
              private static final String DONARY_URL = "https://p.donary.com/";
              private static GeckoRuntime runtime;

              private GeckoSession session;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  root.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  GeckoView geckoView = new GeckoView(this);
                  geckoView.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  root.addView(geckoView);
                  setContentView(root);

                  if (runtime == null) {
                      runtime = GeckoRuntime.create(getApplicationContext());
                  }

                  session = new GeckoSession();
                  session.open(runtime);
                  geckoView.setSession(session);
                  session.loadUri(DONARY_URL);
              }

              @Override
              protected void onDestroy() {
                  if (session != null) {
                      session.close();
                      session = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          echo "Project created."
          find . -maxdepth 6 -type f -print

      - name: Resolve GeckoView and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" Donary-Standalone.apk
          sha256sum Donary-Standalone.apk > Donary-Standalone.apk.sha256
          ls -lh Donary-Standalone.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Donary-Standalone-APK
          path: |
            Donary-Standalone.apk
            Donary-Standalone.apk.sha256
          if-no-files-found: error
          retention-days: 30
          
