name: Build standalone Donary APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create locked Donary GeckoView project
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          files = {
              'settings.gradle': '',
              'build.gradle': 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMTEuMScgYXBwbHkgZmFsc2UKfQo=',
              'gradle.properties': 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXg0MDk2bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==',
              'app/build.gradle': '',
              'app/src/main/AndroidManifest.xml': '',
              'app/src/main/java/com/yiddishcoaching/donary/MainActivity.java': '',
              'app/src/main/res/drawable/ic_launcher.xml': '',
          }

          for filename, encoded in files.items():
              path = Path(filename)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              print(f'Created {filename}')
          PY

      - name: Build signed debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Donary-Standalone.apk
          sha256sum Donary-Standalone.apk | tee Donary-Standalone.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Donary-Standalone-APK
          path: |
            Donary-Standalone.apk
            Donary-Standalone.apk.sha256
          if-no-files-found: error
          retention-days: 30
